{% extends "base.html" %}
{% block title %}Transfer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">🔁 Transfer Money</h3>
        <p class="text-muted">Current Balance: Rs. {{ "%.2f"|format(account.balance) }}</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Receiver's Account Number</label>
            <input type="text" name="receiver_account" class="form-control" maxlength="6" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-info w-100">Transfer</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="btn btn-link mt-2 w-100">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
