{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Create Account</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" maxlength="10" pattern="\d{10}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Create 4-digit PIN</label>
            <input type="password" name="pin" class="form-control" maxlength="4" pattern="\d{4}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm PIN</label>
            <input type="password" name="confirm_pin" class="form-control" maxlength="4" pattern="\d{4}" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
