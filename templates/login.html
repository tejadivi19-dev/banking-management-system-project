{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Login</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Account Number</label>
            <input type="text" name="account_number" class="form-control" maxlength="6" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">PIN</label>
            <input type="password" name="pin" class="form-control" maxlength="4" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          New here? <a href="{{ url_for('register') }}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
