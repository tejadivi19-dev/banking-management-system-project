{% extends "base.html" %}
{% block title %}Change PIN{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">🔑 Change PIN</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Old PIN</label>
            <input type="password" name="old_pin" class="form-control" maxlength="4" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">New PIN</label>
            <input type="password" name="new_pin" class="form-control" maxlength="4" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New PIN</label>
            <input type="password" name="confirm_pin" class="form-control" maxlength="4" required>
          </div>
          <button type="submit" class="btn btn-warning w-100">Update PIN</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="btn btn-link mt-2 w-100">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
